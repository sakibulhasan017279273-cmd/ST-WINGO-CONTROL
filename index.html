<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ST Wingo Control</title>

    <meta
        name="theme-color"
        content="#05070d"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="bg-grid"></div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <!-- =========================================
         MAIN APPLICATION
    ========================================== -->

    <main class="app">

        <!-- HEADER -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    ST
                </div>

                <div>
                    <h1>ST WINGO</h1>

                    <span>
                        CONTROL PANEL
                    </span>
                </div>

            </div>

            <div
                class="status"
                id="connection-status"
            >
                OFFLINE
            </div>

        </header>


        <!-- =====================================
             ACCESS CARD
        ====================================== -->

        <section
            class="card access-card"
            id="access-card"
        >

            <div class="card-title">
                <span>SECURE ACCESS</span>
            </div>

            <p class="card-subtitle">
                Enter your access password
            </p>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="ENTER PASSWORD"
                    autocomplete="off"
                >

                <button
                    id="access-btn"
                    type="button"
                >
                    ACCESS
                </button>

            </div>

            <div
                class="error"
                id="password-error"
            ></div>

        </section>


        <!-- =====================================
             CONTROL PANEL
        ====================================== -->

        <section
            class="card control-card hidden"
            id="control-card"
        >

            <div class="panel-header">

                <div>

                    <div class="eyebrow">
                        LIVE WINGO
                    </div>

                    <h2>
                        SIGNAL CONTROL
                    </h2>

                </div>

                <button
                    class="icon-btn"
                    id="hide-btn"
                    type="button"
                >
                    HIDE
                </button>

            </div>


            <!-- PERIOD -->

            <div class="data-block">

                <div class="label">
                    PERIOD
                </div>

                <div
                    class="period"
                    id="period"
                >
                    CONNECTING...
                </div>

            </div>


            <!-- COUNTDOWN -->

            <div class="countdown-wrap">

                <div class="label">
                    COUNTDOWN
                </div>

                <div
                    class="countdown"
                    id="countdown"
                >
                    60
                </div>

                <div class="seconds">
                    SECONDS
                </div>

            </div>


            <!-- SIGNAL -->

            <div class="signal-box">

                <div class="label">
                    SIGNAL
                </div>

                <div
                    class="signal"
                    id="signal"
                >
                    WAIT
                </div>

            </div>


            <!-- NUMBER -->

            <div class="number-row">

                <div class="mini-card">

                    <span>
                        NUMBER
                    </span>

                    <strong id="number">
                        -
                    </strong>

                </div>

                <div class="mini-card">

                    <span>
                        STATUS
                    </span>

                    <strong id="round-status">
                        WAITING
                    </strong>

                </div>

            </div>


            <!-- RESULT -->

            <div
                class="result-box hidden"
                id="result-box"
            >

                <div
                    class="result"
                    id="result"
                >
                    -
                </div>

                <div
                    class="result-text"
                    id="result-text"
                >
                    -
                </div>

            </div>


            <!-- HISTORY -->

            <div class="history-section">

                <div class="history-title">
                    RECENT HISTORY
                </div>

                <div
                    class="history"
                    id="history"
                >
                    <div class="empty">
                        No results yet
                    </div>
                </div>

            </div>

        </section>


        <!-- =====================================
             BOTTOM ACTIONS
        ====================================== -->

        <section
            class="actions hidden"
            id="actions"
        >

            <button
                class="action-btn"
                id="show-btn"
                type="button"
            >
                SHOW SIGNAL
            </button>

            <a
                class="action-btn secondary"
                href="https://24bdwin24.com/register?inviteCode=EPQYQTN&from=app"
                target="_blank"
                rel="noopener noreferrer"
            >
                REGISTER
            </a>

            <a
                class="action-btn secondary"
                href="https://13bdwin24.com/login"
                target="_blank"
                rel="noopener noreferrer"
            >
                LOGIN
            </a>

            <a
                class="action-btn secondary"
                href="https://t.me/ST_Sakib101"
                target="_blank"
                rel="noopener noreferrer"
            >
                CONTACT
            </a>

        </section>


        <!-- FOOTER -->

        <footer>

            <span>
                ST WINGO CONTROL
            </span>

            <span>
                •
            </span>

            <span>
                LIVE SYSTEM
            </span>

        </footer>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>
</html>
